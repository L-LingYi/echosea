services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: companion-postgres
    restart: unless-stopped
    mem_limit: 512m
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=40
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-companion}
      POSTGRES_USER: ${POSTGRES_USER:-companion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-companion_secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/migrations_v2_v3.sql:/docker-entrypoint-initdb.d/02-migrations.sql:ro
      - ./db/migrations_v1_1.sql:/docker-entrypoint-initdb.d/03-migrations-v1.1.sql:ro
      - ./db/migrations_v1_2.sql:/docker-entrypoint-initdb.d/04-migrations-v1.2.sql:ro
      - ./db/migrations_v1_3.sql:/docker-entrypoint-initdb.d/05-migrations-v1.3.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-companion} -d ${POSTGRES_DB:-companion}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - companion_net

  redis:
    image: redis:7-alpine
    container_name: companion-redis
    restart: unless-stopped
    mem_limit: 64m
    command: redis-server --appendonly yes --maxmemory 48mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - companion_net

  companion-core:
    build: .
    container_name: companion-core
    restart: unless-stopped
    mem_limit: 448m
    env_file:
      - .env
    environment:
      APP_GIT_COMMIT: ${APP_GIT_COMMIT:-}
      TZ: ${TZ:-Asia/Shanghai}
      APP_TIMEZONE: ${APP_TIMEZONE:-${TZ:-Asia/Shanghai}}
    volumes:
      - sticker_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - companion_net

  searxng:
    image: searxng/searxng:latest
    container_name: companion-searxng
    restart: unless-stopped
    mem_limit: 192m
    profiles: ["search"]
    volumes:
      - ./ops/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - TZ=${TZ:-Asia/Shanghai}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - companion_net

  caddy:
    image: caddy:2-alpine
    container_name: companion-caddy
    restart: unless-stopped
    mem_limit: 64m
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - companion-core
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - companion_net

  pg-backup:
    image: postgres:17-alpine
    container_name: companion-pg-backup
    restart: unless-stopped
    mem_limit: 128m
    profiles: ["backup"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-companion_secret}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "while true; do
        pg_dump -h postgres -U ${POSTGRES_USER:-companion} ${POSTGRES_DB:-companion} | gzip > /backups/companion_$$(date +%Y%m%d_%H%M%S).sql.gz;
        find /backups -name 'companion_*.sql.gz' -mtime +14 -delete;
        sleep 86400;
      done"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - companion_net

volumes:
  pg_data:
  redis_data:
  sticker_data:
  caddy_data:
  caddy_config:

networks:
  companion_net:
    driver: bridge
